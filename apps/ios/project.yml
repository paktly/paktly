name: Paktly
options:
  bundleIdPrefix: io.paktly
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Paktly:
    type: application
    platform: iOS
    sources:
      - path: Paktly
    info:
      path: Paktly/Info.plist
      properties:
        CFBundleDisplayName: Paktly
        NSMicrophoneUsageDescription: Speak to Paktly uses your microphone only while you record a command.
        NSSpeechRecognitionUsageDescription: Paktly shows a live transcript while you speak so you can verify what it hears.
        PaktlyAPIBaseURL: https://api.paktly.io/api/v1
        PaktlyAPNSEnvironment: $(PAKTLY_APNS_ENVIRONMENT)
        SocketFiAPIBaseURL: https://api.socket.fi
        SocketFiClientID: sf_client_live_mq2aa2w2ofwynne6gkftyendov8k
        SocketFiApplicationID: io.paktly.app
        SocketFiNetwork: TESTNET
        SocketFiRPID: socket.fi
        PaktlyGoogleIOSClientID: 41146548867-btsmojjnpkc7nbmup1sdp4rnr8f1ula1.apps.googleusercontent.com
        PaktlyGoogleServerClientID: 41146548867-jof7pg8sm1gjddi8fq657s9esft7qi34.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.41146548867-btsmojjnpkc7nbmup1sdp4rnr8f1ula1
          - CFBundleURLName: io.paktly.invitation
            CFBundleURLSchemes:
              - paktly
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIImageName: PaktlyMark
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
        com.apple.Push:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.paktly.app
        DEVELOPMENT_TEAM: GC29BX444D
        CODE_SIGN_ENTITLEMENTS: Paktly/Paktly.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PAKTLY_APNS_ENVIRONMENT: SANDBOX
        Release:
          PAKTLY_APNS_ENVIRONMENT: PRODUCTION
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    scheme:
      testTargets:
        - PaktlyTests
  PaktlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PaktlyTests
    dependencies:
      - target: Paktly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.paktly.app.tests
