name: Paktly
options:
  bundleIdPrefix: io.paktly
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Paktly:
    type: application
    platform: iOS
    sources:
      - path: Paktly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.paktly.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Paktly
        INFOPLIST_KEY_PaktlyAPIBaseURL: $(PAKTLY_API_BASE_URL)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Paktly/Paktly.entitlements
      configs:
        Debug:
          PAKTLY_API_BASE_URL: https://api.paktly.io/api/v1
        Release:
          PAKTLY_API_BASE_URL: https://api.paktly.io/api/v1
    scheme:
      testTargets:
        - PaktlyTests
  PaktlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PaktlyTests
    dependencies:
      - target: Paktly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.paktly.app.tests
