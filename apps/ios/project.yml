name: Paktly
options:
  bundleIdPrefix: io.paktly
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Paktly:
    type: application
    platform: iOS
    sources:
      - path: Paktly
    info:
      path: Paktly/Info.plist
      properties:
        CFBundleDisplayName: Paktly
        PaktlyAPIBaseURL: https://api.paktly.io/api/v1
        SocketFiAPIBaseURL: https://api.socket.fi
        SocketFiClientID: sf_client_live_mq2aa2w2ofwynne6gkftyendov8k
        SocketFiApplicationID: io.paktly.app
        SocketFiNetwork: TESTNET
        SocketFiRPID: socket.fi
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIImageName: PaktlyMark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.paktly.app
        DEVELOPMENT_TEAM: GC29BX444D
        CODE_SIGN_ENTITLEMENTS: Paktly/Paktly.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PaktlyTests
  PaktlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PaktlyTests
    dependencies:
      - target: Paktly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.paktly.app.tests
