name: pakt-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pakt
      POSTGRES_PASSWORD: pakt_local_only
      POSTGRES_USER: pakt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakt -d pakt"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "56432:5432"
    volumes:
      - pakt-postgres-18:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - pakt-redis:/data

volumes:
  pakt-postgres-18:
  pakt-redis:
